type Query {
  """
  Radius search from a given lat/long point out to `distance`, requires auth. Paginated
  (defaultCount 50) via a custom builder class rather than the bounding-box approach used by
  noticesWhereLocation.
  """
  noticesWhereDistance(
    distance: Int!
    lat: Float!
    long: Float!
    orderBy: [QueryNoticesWhereDistanceOrderByOrderByClause!]
    types: [NoticeType]

    "Use categorySelection instead"
    omitCategories: [String]

    categorySelection: [ReversableCategorySelection]
    themes: [ID]

    "Limits number of fetched items."
    first: Int! = 50

    "The offset from which items are returned."
    page: Int
  ): NoticePaginator!

  "Fetch a single Notice by id."
  notice(id: ID, distanceToPoint: LocationUserPoint): Notice
}

"A point to compute Notice.distance_to_user against, for single-notice lookups."
input LocationUserPoint {
  latitude: Float!
  longitude: Float!
}

"Order by clause for Query.noticesWhereDistance.orderBy."
input QueryNoticesWhereDistanceOrderByOrderByClause {
  "The column that is used for ordering."
  column: QueryNoticesWhereDistanceOrderByColumn!

  "The direction that is used for ordering."
  order: SortOrder!
}

"Allowed column names for Query.noticesWhereDistance.orderBy."
enum QueryNoticesWhereDistanceOrderByColumn {
  CREATED_AT
}

"Directions for ordering a list of records."
enum SortOrder {
  "Sort records in ascending order."
  ASC

  "Sort records in descending order."
  DESC
}

enum NoticeType {
  GIVE_SELL
  GIVE_TRADE
  GIVE_FREE
  GIVE_GENERIC
  NEED_BUY
  NEED_TRADE
  NEED_FREE
  NEED_GENERIC
  COLLECTOR
}

input ReversableCategorySelection {
  include: [CategorySelection]
  exclude: [CategorySelection]
}

input CategorySelection {
  category: String!
  subCategories: [String]
  schema_version: Int
}

"A paginated list of Notice items."
type NoticePaginator {
  "Pagination information about the list of items."
  paginatorInfo: PaginatorInfo!

  "A list of Notice items."
  data: [Notice!]!
}

"Information about pagination using a fully featured paginator."
type PaginatorInfo {
  "Number of items in the current page."
  count: Int!

  "Index of the current page."
  currentPage: Int!

  "Index of the first item in the current page."
  firstItem: Int

  "Are there more pages after this one?"
  hasMorePages: Boolean!

  "Index of the last item in the current page."
  lastItem: Int

  "Index of the last available page."
  lastPage: Int!

  "Number of items per page."
  perPage: Int!

  "Number of total available items."
  total: Int!
}

