"Indicates what fields are available at the top level of a query operation."
type Query {
    "Resolve a town name to coordinates via the Nominatim geocoding API."
    geocodeTown(
        "The town name to geocode. Must be non-blank."
        town: String! @rules(apply: ["required", "regex:/\\S/"])
    ): TownLocation!

    "Fetch help posts near a coordinate from the upstream Commu API, most recent first."
    noticesWhereDistance(
        "Latitude of the search point."
        lat: Float! @rules(apply: ["required", "numeric", "between:-90,90"])

        "Longitude of the search point."
        long: Float! @rules(apply: ["required", "numeric", "between:-180,180"])

        "Search radius in meters."
        distance: Int! = 15000 @rules(apply: ["integer", "between:1,100000"])

        "Page size."
        first: Int! = 20 @rules(apply: ["integer", "between:1,50"])

        "Page number, 1-indexed. Defaults to the first page."
        page: Int @rules(apply: ["integer", "min:1"])
    ): NoticePaginator!

    "Generate a short natural-language summary of what kinds of help are typically requested or offered near a town, grounded in its recent nearby help posts."
    areaSummary(
        "The town name, echoed verbatim in the generated summary text."
        town: String! @rules(apply: ["required", "regex:/\\S/"])

        "Latitude of the search point."
        lat: Float! @rules(apply: ["required", "numeric", "between:-90,90"])

        "Longitude of the search point."
        long: Float! @rules(apply: ["required", "numeric", "between:-180,180"])

        "Search radius in meters."
        distance: Int! = 15000 @rules(apply: ["integer", "between:1,100000"])
    ): AreaSummary!

    "Fetch a single help post by id, with the fields the help-post detail screen needs."
    notice(
        "Identity of the help post to fetch."
        id: ID! @rules(apply: ["required"])

        "Latitude of the viewer's current position, to populate distance_to_user. Optional; omit to leave it null."
        lat: Float @rules(apply: ["numeric", "between:-90,90", "required_with:long"])

        "Longitude of the viewer's current position, to populate distance_to_user. Optional; omit to leave it null."
        long: Float @rules(apply: ["numeric", "between:-180,180", "required_with:lat"])
    ): NoticeDetail!
}

"A generated summary of nearby help-post activity."
type AreaSummary {
    "A concise 2-sentence plain-prose description of the kinds of help typically requested or offered nearby. A canned message if too few nearby posts exist to summarize."
    summary: String!
}

"A town resolved to a single geographic point."
type TownLocation {
    "The town name as provided in the request."
    town: String!

    "Latitude of the resolved location."
    latitude: Float!

    "Longitude of the resolved location."
    longitude: Float!
}

"A page of nearby help posts, most recent first. Mirrors the upstream Commu paginator shape."
type NoticePaginator {
    "Pagination metadata for the current page."
    paginatorInfo: PaginatorInfo!

    "Help posts on the current page."
    data: [Notice!]!
}

"Pagination metadata, mirroring the upstream Commu paginator."
type PaginatorInfo {
    "Number of help posts on the current page."
    count: Int!

    "The current page number."
    currentPage: Int!

    "Whether another page of results exists beyond this one."
    hasMorePages: Boolean!
}

"A help post (Notice in the Commu API, Help Post in the product UI)."
type Notice {
    "Identity of the help post."
    id: ID!

    "Title of the help post."
    title: String!

    "Description of the help post, if provided."
    description: String

    "Whether the post is offering (GIVE) or requesting (NEED) help, and of what kind."
    type: NoticeType!

    "Whether the post is on the giving or needing side."
    side: NoticeSide

    "Main and sub category the post is filed under."
    categories: NoticeCategories!

    "When the help post was created, as an ISO 8601 timestamp."
    created_at: String!

    "Where the help post is located."
    position: NoticePosition!

    "Distance from the search point, in meters."
    distance_to_user: Float

    "Main image of the help post, if any."
    image: NoticeImage

    "The user who posted the help post."
    owner: NoticeOwner
}

"Main and sub category a help post is filed under."
type NoticeCategories {
    "The post's primary category, if categorized."
    main: Category

    "The post's sub-categories, if any."
    sub: [Category!]!
}

"A help post category."
type Category {
    "Identity of the category."
    id: ID

    "Machine-readable category name."
    key: String!
}

"A geographic point a help post is located at."
type NoticePosition {
    "Latitude of the help post."
    latitude: Float!

    "Longitude of the help post."
    longitude: Float!
}

"What kind of help a post is offering or requesting."
enum NoticeType {
    GIVE_SELL
    GIVE_TRADE
    GIVE_FREE
    GIVE_GENERIC
    NEED_BUY
    NEED_TRADE
    NEED_FREE
    NEED_GENERIC
    COLLECTOR
}

"Whether a help post is on the giving or needing side."
enum NoticeSide {
    GIVE
    NEED
}

"A single help post with the fields the help-post detail screen needs."
type NoticeDetail {
    "Identity of the help post."
    id: ID!

    "Title of the help post."
    title: String!

    "Description of the help post, if provided."
    description: String

    "What the poster is asking for in return, if anything. Null/empty means nothing was asked in return."
    in_return: String

    "Whether the post is offering (GIVE) or requesting (NEED) help, and of what kind."
    type: NoticeType!

    "Whether the post is on the giving or needing side."
    side: NoticeSide

    "When the help post was created, as an ISO 8601 timestamp."
    created_at: String!

    "Distance from the viewer's position, in meters. Null unless lat/long were provided."
    distance_to_user: Float

    "Number of likes the help post has."
    likes: Int

    "Main image of the help post, if any."
    image: NoticeImage

    "Where the help post is located."
    position: NoticePosition!

    "Main and sub category the post is filed under."
    categories: NoticeCategories!

    "The user who posted the help post."
    owner: NoticeOwner

    "The company/organization the post belongs to, if posted by one rather than an individual."
    company: NoticeCompany

    "Author-provided translations of this post, if any. Empty when the author didn't provide any."
    notice_language_versions: [NoticeTranslation!]!
}

"The main image attached to a help post."
type NoticeImage {
    "URL of the image."
    url: String
}

"The user who posted a help post."
type NoticeOwner {
    "Identity of the user."
    id: ID!

    "Display name of the user."
    name: String!

    "Avatar image URL, if set."
    avatar_url: String

    "Raw upstream trust score. No documented mapping to a UI trust label yet."
    trust_level: Int

    "Verifications completed by the user, if any."
    accountVerifications: [AccountVerification!]!
}

"A completed (or in-progress) account verification."
type AccountVerification {
    "Type of verification, e.g. identity or phone."
    type: String!

    "When the verification completed, as an ISO 8601 timestamp. Null if not yet completed."
    completed_at: String
}

"The company/organization that posted a help post."
type NoticeCompany {
    "Identity of the company."
    id: ID!

    "Name of the company."
    name: String!

    "Logo image URL, if set."
    logo_url: String
}

"An author-provided translation of a help post's text."
type NoticeTranslation {
    "Translated title."
    title: String!

    "Translated description, if provided."
    description: String

    "Translated 'asked in return' text, if provided."
    in_return: String

    "Language code this translation is in."
    language: String!
}
