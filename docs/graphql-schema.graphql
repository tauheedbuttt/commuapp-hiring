"""
Loose type that allows any value. Be careful when passing in large `Int` or `Float` literals,
as they may not be parsed correctly on the server side. Use `String` literals if you are
dealing with really large numbers to be on the safe side.
"""
scalar Mixed

"""
Root write mutation type, guarded via the type-level `@customGuard` directive — verified against
its implementation (`app/GraphQL/Directives/CustomGuardDirective.php`): a thin wrapper around
Lighthouse's built-in `@guard`, whose own docblock states the check "is run per field and may
allow unauthenticated users to still receive partial results" — so an unauthenticated caller is
not necessarily rejected outright for every field; don't assume hard-rejection without checking
the specific field/resolver. Bare `@deprecated` with no `reason:` gives no migration path; when
adding new deprecations, always include `reason: "Use X instead"` (see
`docs/graphql-schema-conventions.md`). Naming is camelCase except `CreateMyInterest`, a known
inconsistency already marked deprecated.
"""
type Mutation {
  createNotice(input: CreateNoticeInput!): Notice
  updateNotice(input: UpdateNoticeInput!): Notice
  createFeedPost(input: CreateFeedPostInput!): FeedPost
  createFeedPostComment(input: CreateFeedPostCommentInput!): FeedPostComment @deprecated(reason: "Use addFeedPostComment instead")
  addFeedPostComment(input: CreateFeedPostCommentInput!): FeedPostComment
  likeFeedPost(id: ID!): Int
  createDeal(input: CreateDealInput!): Deal
  respondDeal(input: RespondDealInput!): Deal
  respondManyDeals(input: RespondManyDealsInput!): [Deal]
  likeGoal(input: LikeGoalInput!): LikeGoalOutput
  createGoalRecord(input: CreateGoalRecordInput!): GoalRecord
  joinChallenge(input: JoinOrLeaveChallengeInput!): Challenge
  leaveChallenge(input: JoinOrLeaveChallengeInput!): Challenge
  updateDeal(input: UpdateDealInput!): Deal
  nullifyDeal(input: NullifyDealInput!): Deal
  createGiveSellContent(input: CreateGiveSellContent!): GiveSellContent
  createGiveTradeContent(input: CreateGiveTradeContent!): GiveTradeContent
  createNeedBuyContent(input: CreateNeedBuyContent!): NeedBuyContent
  createNeedTradeContent(input: CreateNeedTradeContent!): NeedTradeContent
  createReview(input: CreateReviewInput!): Review
  updateReview(input: UpdateReviewInput!): Review
  setReviewCommentVisibility(input: UpdateReviewCommentVisibilityInput!): Review
  createReviewAccolade(input: CreateReviewAccolade!): ReviewAccolade
  addBadgeToUser(input: CreateBadgeInput!): Badge
  updateProfile(input: UpdateUserInput!): User
  setProfilePicture(file: Upload, fileAsBase64: String): User
  setCompanyLogo(file: Upload, fileAsBase64: String, company: ID!): Company
  setEmployeeAvatar(file: Upload, fileAsBase64: String, employeeProfile: ID!): EmployeeProfile
  deleteNotice(id: ID!, cancelDeals: Boolean): Notice
  createChat(input: CreateChatInput): Chat
  createTeam(input: CreateTeamInput!): Team
  createChatMessage(input: CreateChatMessageInput): ChatMessage
  createDelayedChatMessage(input: CreateChatMessageInput): DelayedMessageResponse
  cancelDelayedChatMessage(taskId: String!): Boolean
  markMessagesRead(input: MarkMessagesReadInput): [ChatMessage]!
  updateCompany(input: UpdateCompanyInput!, id: ID!): Company
  updateEmployee(input: UpdateEmployeeInput!, id: ID!): EmployeeProfile
  completeRequiresUserActionEvent(input: CompleteRequiresUserActionEventInput): Boolean!
  pinChatMessage(input: PinMessageInput): Boolean
  toggleChatMessageReaction(messageId: ID!, reaction: String!): ChatMessage
  acceptRules: Boolean
  markReviewRequested: Boolean
  likeNotice(id: ID!): Boolean
